name: GIBowl
options:
  bundleIdPrefix: com.mph
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  GIBowlCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: WS4GXJ44LJ
    CODE_SIGN_STYLE: Automatic
targets:
  GIBowl:
    type: application
    platform: iOS
    sources:
      - path: GIBowl
      - path: ../public/foods.json
        buildPhase: resources
    dependencies:
      - package: GIBowlCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mph.GIBowl
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GI Bowl
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Photograph a nutrition label to add a food.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GIBowlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GIBowlTests
    dependencies:
      - target: GIBowl
      - package: GIBowlCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mph.GIBowlTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GIBowl.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GIBowl
  GIBowlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GIBowlUITests
    dependencies:
      - target: GIBowl
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mph.GIBowlUITests
        TEST_TARGET_NAME: GIBowl
schemes:
  GIBowl:
    build:
      targets:
        GIBowl: all
    test:
      targets:
        - GIBowlTests
        - GIBowlUITests
